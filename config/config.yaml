data:
  # Historical lane: immutable training data, locked for model development only
  historical_raw_path: "data/historical/raw/"
  historical_feature_engineered_path: "data/historical/feature_engineered/"
  historical_final_processed_path: "data/historical/final_processed/"
  historical_merged_file: "data/historical/raw/electricity_demand_2021-01-01_to_2026-04-06.csv"
  historical_demand_load_path: "data/historical/raw/demand_load/"
  historical_weather_path: "data/historical/raw/weather/"
  historical_calendar_path: "data/historical/raw/calendar/"
  
  # Operational lane: ephemeral scraping data for future inference only
  operational_raw_path: "data/operational/raw/"
  operational_processed_path: "data/operational/processed/"
  
  # Models and metadata
  models_root: "models/"
  models_checkpoints_dir: "models/runs/"
  models_config_dir: "models/config/"
  active_model_pointer: "models/ACTIVE_MODEL.txt"
  prep_metadata_path: "data/historical/final_processed/prep_metadata.json"
  
  # Training input (splits)
  historical_splits_path: "data/historical/final_processed/"
  training_splits:
    train: "train_data.parquet"
    val: "val_data.parquet"
    test: "test_data.parquet"

  # === Split boundaries (authoritative: test_start_date) ===
  # The split is derived BACKWARD from test_start_date:
  #   val_start  = test_start_date - training_val_days
  #   train ends < val_start
  #   val        [val_start, test_start)
  #   test       [test_start, test_end_date + 23:45]
  # See src/dataset_builder.py::DatasetBuilder::split_dataframe.
  test_start_date: "2025-04-07"   # first test timestamp is 2025-04-07 00:00
  test_end_date: "2026-04-06"     # last test timestamp is 2026-04-06 23:45
  training_val_days: 45           # val window: 2025-02-21 → 2025-04-06 (4,320 rows)
  test_expected_rows: 35040       # exactly 365 * 96; loud-fail assertion

  # === Boundary glitch correction (Step 1 of audit plan) ===
  # Detects + corrects the +3000 MW spikes that appear at the first 00:00
  # tick of each day in the merged SLDC feed. Threshold is scale-adaptive:
  # rolling MAD of the per-step load differences over a 24h window, flagged
  # when |Δload| > mad_mult × rolling_MAD. Tuned by `mad_mult`; default 6.0
  # catches the +3000 MW / −1500 MW boundary jumps without false-flagging
  # legitimate load ramps.
  glitch_correction:
    mad_window: 96              # 24h rolling window for MAD computation
    mad_mult: 6.0               # threshold = mad_mult × rolling_MAD
    min_periods: 24             # 6h minimum data in window to compute MAD
    interpolate_limit: 2        # max consecutive NaNs to interpolate across

  # === Deprecated ===
  # `training_split_cutoff` is DEPRECATED. Setting it triggers a
  # DeprecationWarning in split_dataframe and falls back to the
  # 50/50-of-remainder logic (≈48-day val/test each instead of the
  # 365-day holdout). Remove this key from any caller config — set
  # `test_start_date` instead.
  # training_split_cutoff: "2025-12-31"   # DEPRECATED, ignored when test_start_date is set

  # Features to drop (audit, redundant, or pre-processing artifacts)
  training_drop_columns:
    - "day_of_year"  # redundant with hour, day_of_week, month
    - "week_of_year"  # redundant
    - "is_weekend"  # derivable from day_of_week
    - "load_mw_raw"  # original before outlier clipping; use clipped version
    - "load_outlier_detected"  # flag only, not a feature
  # List of audit-column regex patterns to drop before training.
  # Parallel patterns kept semantically distinct (per audit round 2):
  #   `.*_was_missing$`           — imputed because cell was NaN
  #   `.*_was_glitch_corrected$`  — interpolated because value was implausible
  # Each can be reported on independently post-training.
  training_drop_patterns:
    - ".*_was_missing$"
    - ".*_was_glitch_corrected$"
  # Back-compat: legacy single-pattern field is also honored by both call sites
  # (training_pipeline._drop_audit_columns and run_full_system).
  training_drop_pattern: ".*_was_missing$"

ingestion:
  start_date: "2026-04-07"
  end_date: "2026-04-13"
  base_csv_path: "data/historical/raw/demand_load/powerdemand_5min_2021_to_2024_load_only.csv"
  latitude: 28.6139
  longitude: 77.2090
  timezone: "Asia/Kolkata"
  retry_total: 5
  backoff_factor: 0.3
  timeout_seconds: 10
  sldc_sleep_seconds: 0.4
  weather_cache_path: ".cache/openmeteo"
  outputs:
    load_snapshot: "data/operational/raw/load_sldc_{start_date}_to_{end_date}.csv"
    weather_snapshot: "data/operational/raw/weather_openmeteo_{start_date}_to_{end_date}.csv"
    merged_snapshot: "data/operational/raw/electricity_demand_{start_date}_to_{end_date}.csv"
    manifest: "data/operational/raw/ingestion_manifest_{start_date}_to_{end_date}.json"

pipeline:
  encoder_window: 192  # 48 hours * 4 — matches decoder_window for a 48h→48h TFT.
                      # Was 96 (24h); bumped in audit step 4 to capture full
                      # weekly seasonality (load has a 7-day cycle from
                      # weekday/weekend) and to align encoder and decoder lengths.
  decoder_window: 192   # 48 hours prediction
  stride: 1

features:
  lags: [4, 24, 96, 672]  # 1h, 6h, 24h, 7d — 672 captures weekly seasonality
  rolling_windows: [4, 24, 96]  # 1h, 6h, 24h — 96 matches encoder length

model:
  hidden_size: 64
  attention_head_size: 4
  dropout: 0.1
  hidden_continuous_size: 8
  output_size: 1  # For point predictions, or 3 for quantiles
  loss: "quantile"  # or "mae"
  quantiles: [0.1, 0.5, 0.9]
  learning_rate: 0.0001
  max_epochs: 50
  batch_size: 128

training:
  early_stopping_patience: 10
  checkpoint_every: 5
  # Resume policy: 'auto' (default), 'scratch' (always from scratch), 'require' (fail if no checkpoint)
  resume_policy: "auto"
  # For trusted local checkpoints, set to false to allow full checkpoint resume on PyTorch>=2.6.
  resume_weights_only: false
  # Checkpoint strategy: 'last' (only last), 'best' (best + last), 'all' (every epoch + last)
  checkpoint_save_strategy: "all"
  checkpoint_every_n_epochs: 1
  # Performance tuning
  precision: "16-mixed"
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  cudnn_benchmark: true