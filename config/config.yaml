data:
  raw_path: "data/raw/electricity_demand.csv"
  processed_path: "data/processed/"
  models_path: "models/"
  prep_metadata_path: "data/processed/prep_metadata.json"

ingestion:
  start_date: "2023-01-01"
  end_date: "2023-01-31"
  latitude: 28.6139
  longitude: 77.2090
  timezone: "Asia/Kolkata"
  retry_total: 5
  backoff_factor: 0.3
  timeout_seconds: 10
  sldc_sleep_seconds: 0.4
  weather_cache_path: ".cache/openmeteo"
  outputs:
    load_snapshot: "data/raw/load_sldc.csv"
    weather_snapshot: "data/raw/weather_openmeteo.csv"
    merged_snapshot: "data/raw/electricity_demand.csv"
    manifest: "data/raw/ingestion_manifest.json"

pipeline:
  encoder_window: 24  # 6 hours * 4
  decoder_window: 192   # 48 hours prediction
  stride: 1

features:
  lags: [4, 24, 96]  # 1h, 6h, 24h
  rolling_windows: [4, 24]  # 1h, 6h

model:
  hidden_size: 64
  attention_head_size: 4
  dropout: 0.1
  hidden_continuous_size: 8
  output_size: 1  # For point predictions, or 3 for quantiles
  loss: "quantile"  # or "mae"
  quantiles: [0.1, 0.5, 0.9]
  learning_rate: 0.001
  max_epochs: 50
  batch_size: 32

training:
  early_stopping_patience: 10
  checkpoint_every: 5